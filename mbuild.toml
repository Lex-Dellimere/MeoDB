# MeoSQL — a relational database written in Mettle, the storage backend for
# flux_orm.
#
#   mbuild build         debug, target linux -> build/linux/debug/meosql
#   mbuild build -r      release
#   mbuild check         type-check every src/ file on its own
#   mbuild test          @test functions in the compile-time interpreter
#   mbuild run meosql    build and run the smoke entry
#   mbuild run b_self    build and run one test program
#
# Compiler: head, not the v0.17.0 release (MeoSQL uses syscall() for
# pread/pwrite/fsync). Point mbuild at it, or pass --mettle:
#   export MBUILD_METTLE_LINUX=/home/nox/Projects/mettle/Mettle/bin/mettle

[package]
name = "meosql"
version = "0.1.0"

[build]
targets = ["linux"]

[profile.release]
flags = ["--release"]

[bin.meosql]
main = "src/main.mettle"

[bin.s0_self]
main = "tests/s0_self.mettle"

[bin.a_self]
main = "tests/a_self.mettle"

[bin.b_self]
main = "tests/b_self.mettle"

[bin.c_self]
main = "tests/c_self.mettle"

[bin.phase1]
main = "tests/phase1.mettle"

[bin.key_self]
main = "tests/key_self.mettle"

[bin.freelist_self]
main = "tests/freelist_self.mettle"

[bin.btree_self]
main = "tests/btree_self.mettle"

# The phase-2 gate: the whole stack in one run (PHASE2.md I1..I4). Declaring it
# here is what puts it in tools/check.sh, which derives its bin list from these
# sections, so it runs in both profiles instead of only by hand.
[bin.phase2]
main = "tests/phase2.mettle"

[bin.j_self]
main = "tests/j_self.mettle"

[bin.journal_self]
main = "tests/journal_self.mettle"

# The change feed and the persisted commit counter (src/feed/, meta.commit_seq).
[bin.feed_self]
main = "tests/feed_self.mettle"

# Run 1, WS0: shared types and status codes (record/value, db/flags,
# catalog/schema, sql/ast, the f64 byte helpers, codes 13-18).
[bin.ws0_self]
main = "tests/ws0_self.mettle"

# The phase-3 gate (K1-K5): b-tree commit / rollback / crash / crash mid-split /
# journal capacity. phase3_child is the process the crash cases kill.
[bin.phase3]
main = "tests/phase3.mettle"

[bin.phase3_child]
main = "tests/phase3_child.mettle"

# Run 1, draft slice: CREATE TABLE + 3000 INSERTs in one transaction, reopen,
# SELECT * -- one thin path through every new layer (DECISIONS.md D10).
[bin.draft]
main = "tests/draft.mettle"

# B-tree delete, byte-balanced splits and float/blob keys, checked against a
# sorted-array oracle.
[bin.btdel_self]
main = "tests/btdel_self.mettle"

# Record codec round trips and corrupt-input checks.
[bin.record_self]
main = "tests/record_self.mettle"

# The db lock under 64 threads.
[bin.lock_self]
main = "tests/lock_self.mettle"

# Catalog persistence, rollback reload and the db transaction API.
[bin.catalog_self]
main = "tests/catalog_self.mettle"

# Table rows, unique indexes, delete and update.
[bin.table_self]
main = "tests/table_self.mettle"

# Typed queries: filters, access paths, ordering, limits, update, delete, count.
[bin.query_self]
main = "tests/query_self.mettle"

# Sockets: loopback echo, receive timeouts, shutdown wake-ups.
[bin.sock_self]
main = "tests/sock_self.mettle"

# Wire codec: every frame kind, truncation and random corruption.
[bin.wire_self]
main = "tests/wire_self.mettle"

# Dropping tables and adding columns, including rollback.
[bin.schema_self]
main = "tests/schema_self.mettle"
